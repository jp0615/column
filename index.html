<title>直式加減小達人</title>
<style>
@font-face{font-family:'PixelTC';src:url(fonts/pixel.woff2) format('woff2');font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;min-height:100%;font-family:'PixelTC',-apple-system,"PingFang TC","Heiti TC",sans-serif;color:#1e1e1e}
body{background:linear-gradient(180deg,#6fbaff 0%,#a9dcff 55%,#d7f0ff 100%) fixed;-webkit-font-smoothing:none}
button{touch-action:manipulation;font-family:inherit}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky i{position:absolute;background:#fff;opacity:.85;height:24px}
#sky i:before,#sky i:after{content:'';position:absolute;background:#fff;height:24px}
#sky i:before{left:24px;top:-24px;width:48px}#sky i:after{left:72px;top:-12px;width:24px;height:36px}
#app:has(.bwrap){max-width:1200px}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 10px)}
h1{font-size:44px;margin:4px 0 0;text-align:center;color:#fff;text-shadow:4px 4px 0 #2c4a1e,-2px -2px 0 #2c4a1e,2px -2px 0 #2c4a1e,-2px 2px 0 #2c4a1e;letter-spacing:2px;font-weight:400}
.sub{text-align:center;font-size:24px;color:#2c4a1e;margin:6px 0 10px}
h2{font-size:30px;margin:8px 0;font-weight:400;color:#2c4a1e}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.panel{background:#c6c6c6;padding:16px;margin:12px 0;box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #fff,0 0 0 4px #1e1e1e}
.btn{display:block;width:100%;border:0;padding:18px 16px;font-size:28px;color:#fff;background:#5aa83a;cursor:pointer;text-align:center;text-shadow:3px 3px 0 rgba(0,0,0,.45);
  box-shadow:inset -6px -6px 0 rgba(0,0,0,.35),inset 6px 6px 0 rgba(255,255,255,.35),0 0 0 4px #1e1e1e;margin:4px 0;position:relative}
.btn:active{transform:translate(2px,2px);box-shadow:inset 6px 6px 0 rgba(0,0,0,.35),inset -6px -6px 0 rgba(255,255,255,.2),0 0 0 4px #1e1e1e}
.btn.blue{background:#3d7fd9}.btn.stone{background:#7a7a7a}.btn.wood{background:#a8743f}.btn.gold{background:#f2c230;color:#3b2a00;text-shadow:2px 2px 0 rgba(255,255,255,.5)}.btn.red{background:#c8443a}.btn.purple{background:#8a55d6}.btn.dia{background:#2bb5b0}
.btn.small{display:inline-block;width:auto;font-size:20px;padding:10px 14px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.35),0 0 0 3px #1e1e1e}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}
.mid{text-align:center;font-size:24px}
.xp{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);padding:6px 10px;box-shadow:0 0 0 3px #1e1e1e}
.xp b{color:#b6ff5a;font-size:22px;font-weight:400;white-space:nowrap;text-shadow:2px 2px 0 #000}
.xpbar{flex:1;height:18px;background:#2b2b2b;box-shadow:inset 0 0 0 2px #000;position:relative}
.xpbar i{position:absolute;left:2px;top:2px;bottom:2px;background:repeating-linear-gradient(90deg,#9cff3a 0 10px,#6fd61c 10px 12px);transition:width .4s}
.blk{display:inline-block;background-size:100% 100%;image-rendering:pixelated;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.icon{width:72px;height:72px;flex:0 0 auto}

.lvrow{display:flex;align-items:center;gap:14px;background:#d8d8d8;padding:12px;margin:12px 0;cursor:pointer;box-shadow:inset -4px -4px 0 #6d6d6d,inset 4px 4px 0 #fff,0 0 0 4px #1e1e1e;position:relative}
.lvrow:active{transform:translate(2px,2px)}
.lvrow .t{flex:1;min-width:0}.lvrow .t b{font-size:28px;font-weight:400;display:block}.lvrow .t span{font-size:19px;color:#444}
.lvrow .ex{font-size:24px;color:#1e5aa8;white-space:nowrap}
.lvrow .st{font-size:24px;color:#e0a800;text-align:right;white-space:nowrap;text-shadow:1px 1px 0 #6b4c00}
.lvrow .st small{display:block;font-size:16px;color:#333;text-shadow:none}
.tag{position:absolute;right:-6px;top:-14px;background:#ff5a3c;color:#fff;font-size:17px;padding:3px 8px;box-shadow:0 0 0 3px #1e1e1e}

.qh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qh .lvname{font-size:22px;color:#2c4a1e;flex:1}
.prog{height:14px;background:#3b3b3b;box-shadow:0 0 0 3px #1e1e1e;margin:8px 0 12px;position:relative}

.boardwrap{background:#c6c6c6;padding:10px 22px 10px;box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #fff,0 0 0 4px #1e1e1e;text-align:center}
.hz{font-size:24px;color:#333;margin-bottom:6px}
.board{--cs:clamp(60px,min(12.5vw,9.4vh),108px);display:grid;grid-template-columns:repeat(var(--n),var(--cs));justify-content:center;margin:0 auto}
.c{width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.74);line-height:1;position:relative;color:#111}
.aux{height:calc(var(--cs)*.62);font-size:calc(var(--cs)*.44)}
.op{color:#111}
.d{background:#ececec;box-shadow:inset 4px 4px 0 #8b8b8b,inset -4px -4px 0 #fff}
.d.tap{cursor:pointer}
.d.tap:after{content:'';position:absolute;left:6px;right:6px;bottom:4px;height:4px;background:repeating-linear-gradient(90deg,#999 0 6px,transparent 6px 10px)}
.d.target{animation:glow 1s infinite}
.d.x:before{content:'';position:absolute;left:6%;top:48%;width:88%;height:7px;background:#e8261c;transform:rotate(-38deg);z-index:2}
.d.x .dg{color:#888}
.pre{position:absolute;left:5%;top:4%;font-size:calc(var(--cs)*.36);color:#e8261c;line-height:1}
.box{width:calc(var(--cs)*.6);height:calc(var(--cs)*.56);border:3px dashed #7a7a7a;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#e8261c;cursor:pointer;position:relative}
.box.on{border-style:solid;border-color:#e8261c;background:#fff}
.box .pre{position:static;font-size:inherit;margin-right:1px}
.box.act,.ans.act{outline:6px solid #ffd400;outline-offset:-2px;animation:glow 1s infinite;z-index:3}
.box.wide{width:calc(var(--cs)*.9)}
.ans{background:#fff;box-shadow:inset 4px 4px 0 #8b8b8b,inset -4px -4px 0 #fff;cursor:default;color:#111}
.ans.ok{background:#bff0a8;color:#0f5a12;box-shadow:inset 4px 4px 0 #3c8a2a,inset -4px -4px 0 #e3ffd6}
.ans.bad{color:#e8261c}
.ghost{opacity:.33}
.line{grid-column:1/-1;height:8px;background:#111;margin:6px 0 8px}
@keyframes glow{50%{outline-color:#ff8a00;box-shadow:0 0 0 6px rgba(255,212,0,.5)}}
.hint{font-size:26px;color:#5a2ca8;min-height:64px;text-align:center;max-width:720px;line-height:1.4;padding:4px 8px}
.hint.big{color:#c2410c}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:520px}
.key{font-size:46px;height:clamp(56px,7vh,84px);border:0;background:#8b8b8b;color:#fff;text-shadow:3px 3px 0 #333;cursor:pointer;box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #bdbdbd,0 0 0 4px #1e1e1e}
.key:active{transform:translate(2px,2px);background:#7a7a7a}
.key.fn{font-size:24px;background:#a8743f;box-shadow:inset -5px -5px 0 #6b4520,inset 5px 5px 0 #d2a06a,0 0 0 4px #1e1e1e}
.key.hl{background:#f2c230;color:#3b2a00;text-shadow:none;box-shadow:inset -5px -5px 0 #a37b00,inset 5px 5px 0 #ffe58a,0 0 0 4px #1e1e1e}
.tip{font-size:18px;color:#333;margin-top:6px}
.pop{animation:pop .45s}.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.fly{position:fixed;z-index:80;width:34px;height:34px;pointer-events:none;transition:transform .7s cubic-bezier(.3,-.4,.6,1),opacity .7s}
.msg{position:absolute;left:50%;top:38%;transform:translateX(-50%);white-space:nowrap;z-index:20;font-size:40px;color:#fff;text-align:center;text-shadow:3px 3px 0 #1e5a12,-2px -2px 0 #1e5a12,2px -2px 0 #1e5a12,-2px 2px 0 #1e5a12;pointer-events:none}.msg:empty{display:none}.solve .left{position:relative}
@media (orientation:landscape) and (min-width:900px){
  .solve{flex-direction:row;align-items:flex-start;justify-content:center;gap:28px}
  .solve .left{flex:0 1 auto;display:flex;flex-direction:column;align-items:center}
  .board{--cs:clamp(64px,10.5vh,100px)}
  .pad{width:400px;margin-top:8px}.key{height:76px}
}
@media (max-width:600px){h1{font-size:30px}.btn{font-size:22px}.key{height:66px;font-size:36px}.hint{font-size:20px}.lvrow .ex{display:none}}
/* 方塊屋 */
.world{position:relative;margin:0 auto;background:linear-gradient(#8fd0ff,#cdeeff);box-shadow:0 0 0 4px #1e1e1e;overflow:hidden}
.world .wg{display:grid;margin:0 auto}
.world .wc{width:var(--w);height:var(--w)}
.world .gh{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.world .nb{animation:drop .5s both}
@keyframes drop{0%{transform:translateY(-200px);opacity:0}70%{transform:translateY(4px);opacity:1}100%{transform:none}}
.wlab{position:absolute;left:8px;top:6px;font-size:20px;color:#1e1e1e;background:rgba(255,255,255,.75);padding:2px 8px}
.buddy{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0}
.bubble{background:#fff;padding:10px 16px;font-size:24px;box-shadow:0 0 0 4px #1e1e1e;position:relative;max-width:560px}
.bubble:before{content:'';position:absolute;left:-14px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#1e1e1e}
/* 我的世界（自己蓋） */
.bwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.bleft{display:flex;flex-direction:column;align-items:center;gap:10px}
#wc{display:block;touch-action:none;box-shadow:0 0 0 4px #1e1e1e;image-rendering:pixelated;cursor:crosshair;background:#8fd0ff}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.tools .btn{width:auto;display:inline-block;font-size:24px;padding:12px 16px;margin:0}
.tools .btn.on{outline:5px solid #ffd400;outline-offset:2px}
.hotbar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:100%;background:#3b3b3b;padding:8px;box-shadow:0 0 0 4px #1e1e1e}
.hb{position:relative;border:0;background:#8b8b8b;padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-family:inherit;
  box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #bdbdbd;min-height:80px;touch-action:manipulation}
.hb .blk{width:42px;height:42px}
.hb .nm{font-size:16px;text-shadow:2px 2px 0 #333;white-space:nowrap}
.hb .ct{position:absolute;right:4px;top:30px;font-size:22px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.hb.sel{background:#f2c230;box-shadow:inset -4px -4px 0 #a37b00,inset 4px 4px 0 #ffe58a,0 0 0 4px #fff}
.hb.sel .nm{color:#3b2a00;text-shadow:none}
.hb.zero .blk{opacity:.35}.hb.zero .ct{color:#ffb0a8}
.hb.lock{background:#555}.hb.lock .blk{filter:grayscale(1) brightness(.5)}
.hb .lk{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:26px}
.binfo{font-size:20px;color:#2c4a1e;text-align:center;min-height:28px}
.bag{display:inline-flex;align-items:center;gap:8px;background:#a8743f;color:#fff;font-size:30px;padding:8px 18px;box-shadow:inset -5px -5px 0 #6b4520,inset 5px 5px 0 #d2a06a,0 0 0 4px #1e1e1e;text-shadow:2px 2px 0 #000}
.bag.bump{animation:pop .3s}
.gotrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0}
.got{display:flex;align-items:center;gap:6px;font-size:24px;background:rgba(255,255,255,.7);padding:4px 10px 4px 4px;box-shadow:0 0 0 3px #1e1e1e}
.unl{font-size:24px;color:#fff;background:#8a55d6;padding:10px 14px;margin:10px 0;text-align:center;box-shadow:0 0 0 4px #1e1e1e;text-shadow:2px 2px 0 #000}
.lvrow .t .u{display:block;font-size:16px;color:#6b3fb0}
.mini{display:block;margin:0 auto;box-shadow:0 0 0 4px #1e1e1e;cursor:pointer;image-rendering:pixelated}
@media (orientation:landscape) and (min-width:900px){
  .bwrap{flex-direction:row;align-items:flex-start;justify-content:center}
  .hotbar{grid-template-columns:repeat(3,1fr);width:300px;flex:0 0 300px}
  .hb{min-height:78px}
}
@media (max-width:600px){.hotbar{grid-template-columns:repeat(5,1fr)}.tools .btn{font-size:18px;padding:10px}}
/* 紀錄 */
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:3px solid #a9a9a9;font-size:22px}
.srow .nm{flex:0 0 230px}
.sbar{flex:1;height:24px;background:#555;box-shadow:inset 0 0 0 2px #222;position:relative}
.sbar i{position:absolute;left:2px;top:2px;bottom:2px}
.sq{display:inline-block;width:12px;height:16px;margin-right:2px;vertical-align:middle}
.weak{color:#c8443a}
.set{display:block;font-size:22px;padding:10px 0;border-bottom:3px dashed #a9a9a9}.set input{width:26px;height:26px;vertical-align:middle;margin-right:8px}
textarea{width:100%;font-size:16px;padding:10px;border:3px solid #1e1e1e;min-height:90px;font-family:monospace}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.ov .panel{max-width:600px;width:100%;text-align:center}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#1e1e1e;color:#fff;padding:14px 24px;font-size:22px;z-index:90;display:none;max-width:90%;text-align:center;box-shadow:0 0 0 3px #fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>

<script>
(function(){
'use strict';
var KEY='columnApp.v1';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(n){return Math.floor(Math.random()*n)}
function now(){return Date.now()}
function pickW(o){var t=0,k;for(k in o)t+=o[k];var r=Math.random()*t;for(k in o){r-=o[k];if(r<=0)return k}return k}

/* ---------- 像素材質（原創，程式即時畫出） ---------- */
var TX={},TXC={};
function seedR(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
function mk(name,seed,fn){var c=document.createElement('canvas');c.width=c.height=16;var x=c.getContext('2d'),r=seedR(seed);
  function p(X,Y,col){x.fillStyle=col;x.fillRect(X,Y,1,1)}function pick(a){return a[Math.floor(r()*a.length)]}
  fn(p,pick,r,x);TX[name]=c.toDataURL();TXC[name]=c}
function noise(p,pick,pal){for(var y=0;y<16;y++)for(var X=0;X<16;X++)p(X,y,pick(pal))}
var DIRT=['#8b5a2b','#7a4e24','#9c6a3a','#6b4220','#8b5a2b'],STONE=['#8a8a8a','#7d7d7d','#959595','#727272','#8a8a8a'];
function ore(name,seed,cols){mk(name,seed,function(p,pick,r){noise(p,pick,STONE);var n=0;while(n<5){var cx=1+Math.floor(r()*13),cy=1+Math.floor(r()*13);
  p(cx,cy,cols[0]);p(cx+1,cy,cols[1]);p(cx,cy+1,cols[1]);if(r()<.7)p(cx+1,cy+1,cols[2]||cols[0]);n++}})}
function buildTextures(){
  mk('dirt',7,function(p,pick){noise(p,pick,DIRT)});
  mk('grass',11,function(p,pick,r){noise(p,pick,DIRT);var G=['#5fb33a','#4e9a2f','#6cc644','#45912a'];for(var X=0;X<16;X++){var h=3+Math.floor(r()*3);for(var y=0;y<h;y++)p(X,y,pick(G))}});
  mk('stone',13,function(p,pick){noise(p,pick,STONE)});
  mk('cobble',17,function(p,pick,r){var cs=[];for(var i=0;i<9;i++)cs.push([r()*16,r()*16,pick(['#8e8e8e','#7b7b7b','#9a9a9a','#6e6e6e'])]);
    function near(X,Y){var b=0,bd=1e9;for(var i=0;i<cs.length;i++){var dx=Math.min(Math.abs(cs[i][0]-X),16-Math.abs(cs[i][0]-X)),dy=Math.min(Math.abs(cs[i][1]-Y),16-Math.abs(cs[i][1]-Y)),d=dx*dx+dy*dy;if(d<bd){bd=d;b=i}}return b}
    for(var y=0;y<16;y++)for(var X=0;X<16;X++){var k=near(X,y);p(X,y,(near(X+1,y)!==k||near(X,y+1)!==k)?'#4d4d4d':cs[k][2])}});
  function planks(name,seed,pal,line){mk(name,seed,function(p,pick){for(var y=0;y<16;y++)for(var X=0;X<16;X++){var row=Math.floor(y/4),seam=row%2?11:4;
    p(X,y,(y%4===3||X===seam)?line:pick(pal))}})}
  planks('plank',19,['#b8894f','#ad7f47','#c29359'],'#7d5a2f');
  planks('roof',23,['#9a4a2e','#8c4229','#a85535'],'#5a2716');
  mk('log',29,function(p,pick){for(var y=0;y<16;y++)for(var X=0;X<16;X++)p(X,y,(X%4===0)?'#4a321c':pick(['#6b4a2b','#5e4025','#73502f']))});
  mk('leaf',31,function(p,pick,r){for(var y=0;y<16;y++)for(var X=0;X<16;X++)p(X,y,r()<.12?'#1f5a17':pick(['#3e8e2f','#2f7a22','#4fa63a']))});
  mk('glass',37,function(p){for(var y=0;y<16;y++)for(var X=0;X<16;X++){var edge=X===0||y===0||X===15||y===15;p(X,y,edge?'#e9f7ff':((X+y===10||X+y===11||X+y===20)?'#ffffff':'#a9dcf5'))}});
  mk('brick',41,function(p,pick){for(var y=0;y<16;y++)for(var X=0;X<16;X++){var row=Math.floor(y/4),off=row%2?4:0;p(X,y,(y%4===3||(X+off)%8===7)?'#d8c8b8':pick(['#a04a3a','#933f31','#ab5444']))}});

    if(op==='-'){if(b>=a)continue;if(ln(a-b)!==ln(a))continue} /* 減法：答案位數和被減數一樣（不出 52−47=5 這種） */

  for(var k=1;k<=7;k++){var s=D.lv[k],a=lvAcc(k);
    h+='<div class="srow">'+icon(LV[k].ore,34)+'<span class="nm">'+k+'. '+LV[k].name+'<br><small style="font-size:16px">'+LV[k].sub+'</small></span>'+
    (s&&s.n?bar(a,a>=.85?'#5fd35f':a>=.6?'#f2c230':'#e8574a')+'<span style="width:150px;text-align:right">'+Math.round(a*100)+'%・'+s.n+' 題</span>':'<span style="flex:1;color:#666">還沒挑戰</span>')+'</div>'+
    (s&&s.h?'<div style="padding:2px 0 6px 44px">最近：'+s.h.split('').map(function(c){return '<i class="sq" style="background:'+(c==='1'?'#3fae3f':'#e8574a')+'"></i>'}).join('')+'</div>':'')}
  h+='<div style="font-size:16px;margin-top:6px;color:#333">百分比＝最近 20 題「一次就算對」的比例。★★★＝練 20 題以上且 9 成都對</div></div>';
  var tags=Object.keys(SK),wk=tags.filter(function(t){var s=D.sk[t];return s&&s.c+s.w>=3}).sort(function(x,y){return D.sk[y].w/(D.sk[y].c+D.sk[y].w)-D.sk[x].w/(D.sk[x].c+D.sk[x].w)}).filter(function(t){return D.sk[t].w>0}).slice(0,2);
  h+='<div class="panel"><b style="font-size:24px">技巧（綜合挑戰會多出比較弱的類型）</b>';
  tags.forEach(function(t){var s=D.sk[t],n=s?s.c+s.w:0,p=n?s.c/n:0;
    h+='<div class="srow"><span class="nm">'+SK[t]+(wk.indexOf(t)>=0?' <b class="weak">要加強</b>':'')+'</span>'+(n?bar(p,p>=.85?'#5fd35f':p>=.6?'#f2c230':'#e8574a')+'<span style="width:150px;text-align:right">'+Math.round(p*100)+'%・'+n+' 題</span>':'<span style="flex:1;color:#666">還沒練過</span>')+'</div>'});
  var days={},hs=D.hist||[];hs.forEach(function(x){var dk=dayKey(x.t);days[dk]=(days[dk]||0)+1});
  var last=[];for(var i=6;i>=0;i--){var dd=new Date(now()-i*86400000),dk2=dayKey(dd.getTime());last.push((dd.getMonth()+1)+'/'+dd.getDate()+'：'+(days[dk2]||0)+' 輪')}
  h+='</div><div class="panel"><b style="font-size:24px">最近 7 天</b><div style="font-size:20px;line-height:1.7;margin-top:6px">'+last.join('　')+'</div></div>';
  h+='<div class="panel" id="settings"><b style="font-size:24px">⚙️ 家長設定</b>'+
  '<label class="set"><input type="checkbox" id="s_sound"'+(D.sound!==false?' checked':'')+'>🎵 音效和聲音</label>'+
  '<label class="set"><input type="checkbox" id="s_voice"'+(D.voice!==false?' checked':'')+'>👨 爸爸的聲音（答對稱讚、答錯鼓勵）</label>'+
  '<label class="set"><input type="checkbox" id="s_guide"'+(D.guideAll?' checked':'')+'>🧭 每一關都一步一步帶著做（預設只有第 2、4 關會帶著做進位／退位）</label>'+
  '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn small blue" data-a="testvoice">🔊 試聽</button><button class="btn small purple" data-a="export">📋 匯出紀錄代碼</button><button class="btn small wood" data-a="import" data-m="merge">📥 合併匯入</button><button class="btn small wood" data-a="import" data-m="replace">取代全部資料</button><button class="btn small red" data-a="reset">清除所有紀錄與方塊</button></div>'+
  '<textarea id="code" placeholder="匯出的代碼會出現在這裡；要匯入就把代碼貼在這裡再按「合併匯入」（保留兩邊比較多的紀錄）"></textarea>'+
  '<div style="font-size:15px;color:#444;margin-top:10px;line-height:1.5">字型：俐方體11號（Cubic 11）子集，SIL Open Font License 1.1（fonts/OFL.txt）。圖案與音效都是本 App 自己畫、自己做的。</div></div>';
  app.innerHTML=h;if(toSet===true){var el=$('#settings');if(el)setTimeout(function(){el.scrollIntoView({block:'start'})},50)}}
/* 匯出：學習資料全部帶走（經驗值、方塊、背包、我的世界、關卡與題型紀錄、解鎖、歷程）；不含系統同步狀態 */
function exportText(){return JSON.stringify({app:'column',fmt:2,exported:new Date().toISOString(),data:D})}
function cPick(a,b,n){if(!a)return b;if(!b)return a;var na=n(a),nb=n(b);if(nb!==na)return nb>na?b:a;return String(b.h||'').length>String(a.h||'').length?b:a}
function cHist(h){return (Array.isArray(h)?h:[]).filter(function(x){return x&&typeof x==='object'&&+x.t})}
function wPlaced(w){var n=0;w=String(w||'');for(var i=0;i<w.length;i++)if(w[i]!=='.')n++;return n}
function invSum(v){var t=0;for(var k in (v||{}))t+=v[k]|0;return t}
function doImport(txt,mode){var o;try{o=JSON.parse(String(txt).trim())}catch(e){toast('代碼格式不正確');return}if(o&&o.app==='column'&&o.data)o=o.data;
  if(!o||typeof o.lv!=='object'||typeof o.sk!=='object'||!o.lv||!o.sk){toast('這不是直式加減的紀錄');return}
  if(mode==='replace'){
    if(!confirm('用匯入的紀錄取代目前的紀錄嗎？'))return;var b=blank();for(var k in b)b[k]=o[k]!==undefined?o[k]:b[k];if(o.v===undefined)b.v=1;D=b;
  }else{
    /* 先把匯入的資料整理成新版格式（舊版代碼的方塊會換成背包），再合併 */
    var cur=D,ib=blank();for(var k2 in ib)ib[k2]=o[k2]!==undefined?o[k2]:ib[k2];if(o.v===undefined)ib.v=1;D=ib;migrate();var inc=D;D=cur;
    var lvN=function(s){return +s.n||0},skN=function(s){return (+s.c||0)+(+s.w||0)};
    Object.keys(inc.lv||{}).forEach(function(k){D.lv[k]=cPick(D.lv[k],inc.lv[k],lvN)});
    Object.keys(inc.sk||{}).forEach(function(k){D.sk[k]=cPick(D.sk[k],inc.sk[k],skN)});
    var seen={},all=cHist(D.hist).concat(cHist(inc.hist)).filter(function(x){var id=x.t+'|'+x.k;if(seen[id])return false;seen[id]=1;return true});
    all.sort(function(x,y){return x.t-y.t});D.hist=all.slice(-60);
    /* 方塊世界不能拼在一起：用賺到方塊比較多的那一邊（世界＋背包＋藍圖） */
    var ia=(+inc.blocks||0),ca=(+D.blocks||0);
    if(ia>ca||(ia===ca&&wPlaced(inc.world)+invSum(inc.inv)>wPlaced(D.world)+invSum(D.inv))){D.world=inc.world;D.inv=inc.inv;D.bp=inc.bp}
    D.blocks=Math.max(ca,ia);D.xp=Math.max(+D.xp||0,+inc.xp||0);
    Object.keys(inc.unl||{}).forEach(function(k){D.unl[k]=D.unl[k]?Math.min(D.unl[k],inc.unl[k]):inc.unl[k]});
    Object.keys(inc.bpDone||{}).forEach(function(k){D.bpDone[k]=D.bpDone[k]?Math.min(D.bpDone[k],inc.bpDone[k]):inc.bpDone[k]});
    if(inc.nudge&&typeof inc.nudge==='object'&&(+inc.nudge.t||0)>(+(D.nudge||{}).t||0))D.nudge=inc.nudge;
    D.migNote=true;
  }
  UNDO=[];migrate();save();go('home');
  overlay('impov','<div style="font-size:30px;color:#2d6a1f;margin-bottom:8px">✅ '+(mode==='replace'?'已取代成匯入的紀錄':'合併匯入完成')+'</div><div style="font-size:24px;line-height:1.6">Lv.'+xpLevel(D.xp).lv+'（經驗值 '+D.xp+'）<br>🎒 背包 '+invTotal()+' 塊、我的世界 '+wPlaced(D.world)+' 塊<br>練習紀錄 '+D.hist.length+' 輪</div><button class="btn" style="margin-top:14px" data-a="ovclose" data-o="impov">👍 好</button>');
  toast('已匯入：經驗值 '+D.xp+'、背包 '+invTotal()+' 塊')}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a;ac();
  switch(a){
    case 'home':G=null;go('home');break;
    case 'menu':go('menu');break;
    case 'house':case 'build':{['migov','nudge','sxov'].forEach(function(id){var o=document.getElementById(id);if(o&&id!=='sxov')o.remove()});if($('#sxov'))break;go('build');break}
    case 'hb':{var t=el.dataset.t,b=BTI[t];if(!isUnl(b)&&!(D.inv[t]|0)){toast('🔒 精通「'+b.u+'. '+LV[b.u].name+'（'+LV[b.u].sub+'）」礦坑，就能解鎖「'+b.n+'」！');break}
      bsel=t;btool='place';sndTap();document.querySelectorAll('.hb.sel').forEach(function(x){x.classList.remove('sel')});el.classList.add('sel');$('#t-place').classList.add('on');$('#t-dig').classList.remove('on');binfo();break}
    case 'tool':btool=el.dataset.t;sndTap();$('#t-place').classList.toggle('on',btool==='place');$('#t-dig').classList.toggle('on',btool==='dig');
      document.querySelectorAll('.hb.sel').forEach(function(x){x.classList.remove('sel')});if(btool==='place'){var hb=document.getElementById('hb-'+bsel);if(hb)hb.classList.add('sel')}binfo();break;
    case 'bundo':bUndo();break;
    case 'bclear':if(confirm('把世界裡所有方塊都收回背包嗎？'))bClear();break;
    case 'bp':D.bp=D.bp+1>=BP.length?-1:D.bp+1;save();sndTap();$('#t-bp').textContent=bpLabel();redraw();binfo();break;
    case 'ovclose':{var oc=document.getElementById(el.dataset.o);if(oc)oc.remove();break}
    case 'stats':view='stats';stats(!!el.dataset.s);if(!el.dataset.s)window.scrollTo(0,0);break;
    case 'sound':D.sound=D.sound===false;save();if(D.sound)sndOk();home();break;
    case 'start':startLevel(+el.dataset.n);break;
    case 'again':startLevel(G.k);break;
    case 'quit':if(confirm('要結束這次挑戰嗎？（已經挖到的方塊會留在背包）')){G=null;go('home')}break;
    case 'key':onKey(el.dataset.k);break;
    case 'car':if(G&&G.S&&!G.S.lock)placeCarry(+el.dataset.i);break;
    case 'top':if(G&&G.S)tapTop(+el.dataset.i);break;
    case 'boxtap':if(G&&G.S&&G.S.box[+el.dataset.i]==null){G.S.act={t:'box',i:+el.dataset.i};drawQ()}break;
    case 'nudgego':{var n=$('#nudge');if(n)n.remove();startLevel(+el.dataset.n);break}
    case 'sxtake':sxTake();break;
    case 'nudgeclose':{var c=$('#nudge');if(c)c.remove();break}
    case 'testvoice':say('ok3');break;
    case 'export':{var t=exportText(),ta=$('#code');ta.value=t;ta.focus();ta.select();try{ta.setSelectionRange(0,t.length)}catch(x){}var ok=false;try{ok=document.execCommand('copy')}catch(x){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('已複製')},function(){});toast(ok?'已複製！到另一台 iPad 貼上就可以匯入':'請長按文字全選後拷貝');break}
    case 'import':{var v=$('#code').value;if(!v.trim()){toast('請先把代碼貼到框框裡');break}doImport(v,el.dataset.m||'merge');break}
    case 'reset':if(confirm('確定清除所有紀錄、經驗值、背包和我的世界？')){var keep={sound:D.sound,voice:D.voice,guideAll:D.guideAll};D=blank();for(var k in keep)D[k]=keep[k];UNDO=[];migrate();save();stats()}break;
  }});
document.addEventListener('change',function(e){var id=e.target.id,v=e.target.checked;
  if(id==='s_sound'){D.sound=v;save();if(v)sndOk()}else if(id==='s_voice'){D.voice=v;save();if(v)say('ok2')}else if(id==='s_guide'){D.guideAll=v;save();toast(v?'每一關都會一步一步帶著做':'只有第 2、4 關會一步一步帶著做')}});
document.addEventListener('keydown',function(e){if(view!=='quiz')return;if(/^[0-9]$/.test(e.key))onKey(e.key);else if(e.key==='Backspace')onKey('del')});
var rzT;window.addEventListener('resize',function(){var c=$('#fx');c.width=innerWidth;c.height=innerHeight;clearTimeout(rzT);rzT=setTimeout(function(){if(view==='build'&&!stroke)buildView()},150)});

window.__col={x:{ev:sxEval,ck:sxCheck,take:sxTake,sync:sxSync,dec:sxDecode},build:build,genTag:genTag,genLevel:genLevel,colHint:colHint,nudgeInfo:nudgeInfo,nudgeCheck:nudgeCheck,D:function(){return D},G:function(){return G},startLevel:startLevel,newQ:newQ,onKey:onKey,tapTop:tapTop,placeCarry:placeCarry,bpAt:bpAt,BP:BP,LV:LV,go:go,setD:function(x){D=x;save()},BT:BT,WA:function(){return WA},earn:earn,migrate:migrate,invTotal:invTotal,bpCells:bpCells,bpProg:bpProg,undo:function(){return UNDO.length},load:load};
buildTextures();load();sxSync();
(document.fonts&&document.fonts.load?document.fonts.load('40px PixelTC','直式0').catch(function(){}):Promise.resolve()).then(function(){render()});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
